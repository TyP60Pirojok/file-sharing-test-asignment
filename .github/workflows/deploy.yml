name: deploy

on:
  push:
    branches: [ master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ (github.repository) }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Логинимся в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собираем Docker-образ
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/${{ (env.IMAGE_NAME) }}:latest
          load: true   # загружаем образ в локальный Docker раннера

      - name: Проверяем работоспособность образа (быстрый тест)
        run: |
          docker run --rm -d -p 8080:8080 --name test-server ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          sleep 5
          curl --fail http://localhost:8080/ || exit 1
          docker stop test-server

      - name: Публикуем образ в GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ (env.IMAGE_NAME) }}:latest

  # ----- Деплой на удалённый сервер по SSH -----
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Копируем docker-compose.yml на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/file-sharing-test-asignment/"

      - name: Подключаемся по SSH и перезапускаем контейнер
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/file-sharing-test-asignment
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose pull
            docker compose up -d --force-recreate
            docker system prune -f

  deploy-local:
    needs: build-and-push
    runs-on: self-hosted   # должен быть настроен на Windows 10 с Docker Desktop
    if: true              # включите, если используете self-hosted runner
    steps:
      - name: Запускаем новый контейнер из последнего образа
        run: |
          docker stop file-sharing-test-asignment || true
          docker rm file-sharing-test-asignment || true
          docker pull ${{ env.REGISTRY }}/${{ (env.IMAGE_NAME) }}:latest
          docker run -d -p 8080:8080 -v ${PWD}/uploads:/app/uploads --name file-sharing-test-asignment ${{ env.REGISTRY }}/${{ (env.IMAGE_NAME) }}:latest
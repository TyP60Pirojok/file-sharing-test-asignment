name: deploy

on:
  push:
    branches: [ master ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Логинимся в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Генерация метаданных
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Собираем Docker-образ
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true   # загружаем образ в локальный Docker раннера

      - name: Проверяем работоспособность образа (быстрый тест)
        run: |
          docker run --rm -d -p 8080:8080 --name test-server ${{ steps.meta.outputs.tags }}
          sleep 5
          curl --fail http://localhost:8080/ || exit 1
          docker stop test-server

      - name: Публикуем образ в GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ----- Деплой на удалённый сервер по SSH -----
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Копируем docker-compose.yml на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/file-sharing-test-asignment/"

      - name: Подключаемся по SSH и перезапускаем контейнер
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/file-sharing-test-asignment
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose pull
            docker compose up -d --force-recreate
            docker system prune -f

  # ----- Локальный деплой на self-hosted runner (Windows 10) -----
  deploy-local:
    needs: build-and-push          # ждём, пока образ соберётся и опубликуется
    runs-on: self-hosted           # запускается на вашем локальном раннере
    # если хотите отключить, добавьте строку: if: false
    steps:
      - name: Логин в GHCR (self-hosted)
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Остановить и удалить старый контейнер (если есть)
        run: |
          docker stop file-sharing-test-asignment || true
          docker rm file-sharing-test-asignment || true

      - name: Загрузить последний образ
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest

      - name: Запустить новый контейнер
        run: |
          docker run -d `
            --name file-sharing-test-asignment `
            -p 8080:8080 `
            -v ${pwd}/uploads:/app/uploads `
            --restart unless-stopped `
            ghcr.io/${{ github.repository }}:latest

      - name: Очистка неиспользуемых образов
        run: |
          docker image prune -f